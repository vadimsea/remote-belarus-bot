# Состояние бота: data/seen.db в репозитории (не Actions cache).
name: Publish to Telegram

on:
  schedule:
    # UTC: 5–20 ≈ 08:00–23:00 Минск (догон слотов до 23:00)
    - cron: "*/5 5-20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тест без отправки в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: remote-belarus-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data directory
        run: mkdir -p data

      - name: Sync bot database
        run: git pull --ff-only origin main

      - name: Promo and vacancies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run --show-schedule
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Commit bot database
        if: github.event.inputs.dry_run != 'true' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          if [ ! -f data/seen.db ]; then
            echo "No database file to save"
            exit 0
          fi
          git add -f data/seen.db
          if git diff --staged --quiet; then
            echo "Database unchanged"
            exit 0
          fi
          git commit -m "chore: bot state [skip ci]"
          git push
