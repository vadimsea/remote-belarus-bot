# GitHub Actions: cron ненадёжен (может пропускать */5). Несколько расписаний + догон слотов в main.py.
name: Publish to Telegram

on:
  schedule:
    - cron: "*/15 6-17 * * *"
    - cron: "5,20,35,50 6-17 * * *"
    - cron: "8,23,38,53 6-17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тест без отправки в Telegram"
        type: boolean
        default: false

concurrency:
  group: remote-belarus-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache/restore@v4
        id: db-cache
        with:
          path: data
          key: remote-belarus-db-v2
          restore-keys: |
            remote-belarus-db-v2
            remote-belarus-db

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data directory
        run: mkdir -p data

      - name: Promo and vacancies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run --show-schedule
            python main.py --dry-run
          else
            python main.py
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: remote-belarus-db-v2
